name: Database backup

# Daily pg_dump of the Neon database to a PRIVATE S3 bucket.
# The media bucket (care-project-cy) is served publicly through CloudFront, so backups -
# which contain password hashes and all content - must NOT go there. Use a separate bucket
# with Block Public Access on. See README "Backups" for the one-time setup.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database and upload to S3
        env:
          # Neon's DIRECT (unpooled) endpoint - pg_dump does not work through the pooler.
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%d_%H%M%S)"
          FILE="careproject-db-${STAMP}.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=plain | gzip -9 > "$FILE"
          SIZE="$(stat -c%s "$FILE")"
          echo "Dump size: ${SIZE} bytes"
          # A healthy dump is comfortably over 10 KB; anything smaller means the dump failed.
          if [ "$SIZE" -lt 10240 ]; then echo "Dump suspiciously small, aborting."; exit 1; fi
          aws s3 cp "$FILE" "s3://${BUCKET}/db/${FILE}"
          echo "Uploaded s3://${BUCKET}/db/${FILE}"

      - name: Prune backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '30 days ago' +%Y-%m-%d)"
          aws s3 ls "s3://${BUCKET}/db/" | while read -r _ _ _ name; do
            [ -z "${name:-}" ] && continue
            file_date="$(echo "$name" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)"
            if [ -n "$file_date" ] && [ "$file_date" \< "$CUTOFF" ]; then
              echo "Deleting old backup: $name"
              aws s3 rm "s3://${BUCKET}/db/${name}"
            fi
          done
